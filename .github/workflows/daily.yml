name: Daily Commit
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          COUNT=$((RANDOM % 6 + 2))
          for i in $(seq 1 $COUNT); do
            echo "$(date -u --iso-8601=seconds) - commit $i of $COUNT" >> heartbeat.txt
            git add heartbeat.txt
            git commit -m "chore: heartbeat ($i/$COUNT)"
          done
          git push
